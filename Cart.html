<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0 1.5rem 3rem;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: #fdf6ec;
    color: #3a2e26;
  }

  header {
    text-align: center;
    padding: 3rem 1rem 1.5rem;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 3rem;
    margin: 0;
    color: #7a3b2e;
    letter-spacing: 1px;
  }

  .subtitle {
    margin-top: 0.5rem;
    font-style: italic;
    color: #a3776a;
  }

  main {
    max-width: 800px;
    margin: 0 auto;
  }

  .cart {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .cart-item {
    display: grid;
    grid-template-columns: 90px 1fr auto auto auto;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #f1e2cd;
  }

  .cart-item:last-of-type {
    border-bottom: none;
  }

  .cart-item img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
  }

  .item-name {
    font-weight: 600;
    color: #4a352b;
  }

  .item-price {
    color: #a3776a;
    font-size: 0.9rem;
  }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: #fdf6ec;
    border: 1px solid #e8c9a0;
    border-radius: 8px;
    padding: 0.2rem 0.4rem;
  }

  .qty-btn {
    background: none;
    border: none;
    font-size: 1.1rem;
    width: 26px;
    height: 26px;
    cursor: pointer;
    color: #7a3b2e;
    font-weight: 700;
  }

  .qty-btn:hover {
    color: #a3543f;
  }

  .qty-value {
    min-width: 20px;
    text-align: center;
    font-weight: 600;
  }

  .line-total {
    font-weight: 700;
    color: #4a352b;
    min-width: 60px;
    text-align: right;
  }

  .remove-btn {
    background: none;
    border: none;
    color: #b25c4a;
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    padding: 0.3rem;
  }

  .remove-btn:hover {
    color: #7a3b2e;
  }

  .cart-summary {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    border-top: 2px solid #e8c9a0;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 1rem;
    color: #4a352b;
  }

  .summary-row.total {
    font-size: 1.3rem;
    font-weight: 700;
    color: #7a3b2e;
  }

  .checkout-btn {
    margin-top: 0.8rem;
    align-self: stretch;
    border: none;
    cursor: pointer;
    padding: 0.9rem 1.6rem;
    background: #7a3b2e;
    color: #fff;
    font-weight: 600;
    font-size: 1.05rem;
    border-radius: 8px;
    transition: background 0.2s ease;
  }

  .checkout-btn:hover {
    background: #a3543f;
  }

  .empty-cart {
    text-align: center;
    padding: 3rem 1.5rem;
    color: #a3776a;
    font-style: italic;
    display: none;
  }

  .continue-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
  }

  .continue-link a {
    color: #7a3b2e;
    text-decoration: none;
    font-weight: 600;
    border-bottom: 2px solid transparent;
  }

  .continue-link a:hover {
    border-color: #7a3b2e;
  }

  @media (max-width: 560px) {
    .cart-item {
      grid-template-columns: 60px 1fr auto;
      grid-template-areas:
        "img name remove"
        "img qty total";
      row-gap: 0.5rem;
    }

    .cart-item img {
      grid-area: img;
      width: 60px;
      height: 60px;
    }

    .item-info {
      grid-area: name;
    }

    .qty-controls {
      grid-area: qty;
      justify-self: start;
    }

    .line-total {
      grid-area: total;
      justify-self: end;
    }

    .remove-btn {
      grid-area: remove;
      justify-self: end;
    }
  }
</style>
</head>
<body>

  <header>
    <h1>Your Cart</h1>
    <p class="subtitle">Review your order before checkout</p>
  </header>

  <main>
    <div class="cart" id="cart">
      <div class="cart-item" data-price="8.50">
        <img src="KFEJFK7.jpg" alt="Banana bread">
        <div class="item-info">
          <div class="item-name">Banana Bread</div>
          <div class="item-price">R8.50 each</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn minus">&minus;</button>
          <span class="qty-value">2</span>
          <button class="qty-btn plus">&plus;</button>
        </div>
        <div class="line-total">R17.00</div>
        <button class="remove-btn" title="Remove">&times;</button>
      </div>

      <div class="cart-item" data-price="10.00">
        <img src="big-fat-chocolate-chip-cookie-05.jpg" alt="Chocolate Chip Cookies">
        <div class="item-info">
          <div class="item-name">Chocolate Chip Cookies</div>
          <div class="item-price">R60.00 each</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn minus">&minus;</button>
          <span class="qty-value">3</span>
          <button class="qty-btn plus">&plus;</button>
        </div>
        <div class="line-total">R15.60</div>
        <button class="remove-btn" title="Remove">&times;</button>
      </div>

      <div class="cart-item" data-price="10.99">
        <img src="red-velvet-cake.webp" alt="Red Velvet Cake">
        <div class="item-info">
          <div class="item-name">Red Velvet Cake</div>
          <div class="item-price">R10.99 each</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn minus">&minus;</button>
          <span class="qty-value">1</span>
          <button class="qty-btn plus">&plus;</button>
        </div>
        <div class="line-total">R10.99</div>
        <button class="remove-btn" title="Remove">&times;</button>
      </div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">R25.35</span>
        </div>
        <div class="summary-row">
          <span>Delivery</span>
          <span>R5.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total">R.35</span>
        </div>
        <button class="checkout-btn">Proceed to Checkout</button>
      </div>
    </div>

    <p class="empty-cart" id="empty-message">Your cart is empty.</p>

    <p class="continue-link"><a href="menu.html">&larr; Continue shopping</a></p>
  </main>

  <script>
    const cart = document.getElementById('cart');
    const emptyMessage = document.getElementById('empty-message');
    const deliveryFee = 5.00;

    function formatMoney(n) {
      return 'R' + n.toFixed(2);
    }

    function updateTotals() {
      let subtotal = 0;
      document.querySelectorAll('.cart-item').forEach(item => {
        const price = parseFloat(item.dataset.price);
        const qty = parseInt(item.querySelector('.qty-value').textContent, 10);
        const lineTotal = price * qty;
        item.querySelector('.line-total').textContent = formatMoney(lineTotal);
        subtotal += lineTotal;
      });

      document.getElementById('subtotal').textContent = formatMoney(subtotal);
      document.getElementById('total').textContent = formatMoney(subtotal + (subtotal > 0 ? deliveryFee : 0));

      const hasItems = document.querySelectorAll('.cart-item').length > 0;
      cart.style.display = hasItems ? 'block' : 'none';
      emptyMessage.style.display = hasItems ? 'none' : 'block';
    }

    cart.addEventListener('click', (e) => {
      const item = e.target.closest('.cart-item');
      if (!item) return;

      if (e.target.classList.contains('plus')) {
        const qtyEl = item.querySelector('.qty-value');
        qtyEl.textContent = parseInt(qtyEl.textContent, 10) + 1;
        updateTotals();
      }

      if (e.target.classList.contains('minus')) {
        const qtyEl = item.querySelector('.qty-value');
        const newQty = parseInt(qtyEl.textContent, 10) - 1;
        if (newQty <= 0) {
          item.remove();
        } else {
          qtyEl.textContent = newQty;
        }
        updateTotals();
      }

      if (e.target.classList.contains('remove-btn')) {
        item.remove();
        updateTotals();
      }
    });

    updateTotals();
  </script>

</body>
</html>
