<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0 1.5rem 3rem;
    font-family: 'Segoe UI', Verdana, sans-serif;
    background: #fdf6ec;
    color: #3a2e26;
  }

  header {
    text-align: center;
    padding: 3rem 1rem 1.5rem;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 3rem;
    margin: 0;
    color: #7a3b2e;
    letter-spacing: 1px;
  }

  .subtitle {
    margin-top: 0.5rem;
    font-style: italic;
    color: #a3776a;
  }

  main {
    max-width: 800px;
    margin: 0 auto;
  }

  .cart {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .cart-item {
    display: grid;
    grid-template-columns: 90px 1fr auto auto auto;
    align-items: center;
    gap: 1rem;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid #f1e2cd;
  }

  .cart-item img {
    width: 90px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
  }

  .item-name {
    font-weight: 600;
    color: #4a352b;
  }

  .item-price {
    color: #a3776a;
    font-size: 0.9rem;
  }

  .qty-controls {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    background: #fdf6ec;
    border: 1px solid #e8c9a0;
    border-radius: 8px;
    padding: 0.2rem 0.4rem;
  }

  .qty-btn {
    background: none;
    border: none;
    font-size: 1.1rem;
    width: 26px;
    height: 26px;
    cursor: pointer;
    color: #7a3b2e;
    font-weight: 700;
  }

  .qty-btn:hover {
    color: #a3543f;
  }

  .qty-value {
    min-width: 20px;
    text-align: center;
    font-weight: 600;
  }

  .line-total {
    font-weight: 700;
    color: #4a352b;
    min-width: 60px;
    text-align: right;
  }

  .remove-btn {
    background: none;
    border: none;
    color: #b25c4a;
    cursor: pointer;
    font-size: 1.2rem;
    line-height: 1;
    padding: 0.3rem;
  }

  .remove-btn:hover {
    color: #7a3b2e;
  }

  .cart-summary {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    border-top: 2px solid #e8c9a0;
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    font-size: 1rem;
    color: #4a352b;
  }

  .summary-row.total {
    font-size: 1.3rem;
    font-weight: 700;
    color: #7a3b2e;
  }

  .checkout-btn {
    margin-top: 0.8rem;
    align-self: stretch;
    border: none;
    cursor: pointer;
    padding: 0.9rem 1.6rem;
    background: #7a3b2e;
    color: #fff;
    font-weight: 600;
    font-size: 1.05rem;
    border-radius: 8px;
    transition: background 0.2s ease;
  }

  .checkout-btn:hover {
    background: #a3543f;
  }

  .checkout-form {
    display: none;
    margin-top: 0.8rem;
    padding-top: 1rem;
    border-top: 1px dashed #e8c9a0;
  }

  .checkout-form.open {
    display: block;
  }

  .checkout-form label {
    display: block;
    margin: 0.7rem 0 0.25rem;
    font-size: 0.9rem;
    color: #4a352b;
  }

  .checkout-form input,
  .checkout-form textarea {
    width: 100%;
    padding: 0.6rem;
    border: 1px solid #e8c9a0;
    border-radius: 8px;
    font: inherit;
    background: #fdf6ec;
  }

  .empty-cart,
  .confirmation {
    text-align: center;
    padding: 3rem 1.5rem;
    color: #a3776a;
    display: none;
  }

  .empty-cart {
    font-style: italic;
  }

  .confirmation {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
    color: #4a352b;
  }

  .confirmation h2 {
    font-family: Georgia, 'Times New Roman', serif;
    color: #7a3b2e;
    margin-top: 0;
  }

  .continue-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
  }

  .continue-link a {
    color: #7a3b2e;
    text-decoration: none;
    font-weight: 600;
    border-bottom: 2px solid transparent;
  }

  .continue-link a:hover {
    border-color: #7a3b2e;
  }

  @media (max-width: 560px) {
    .cart-item {
      grid-template-columns: 60px 1fr auto;
      grid-template-areas:
        "img name remove"
        "img qty total";
      row-gap: 0.5rem;
    }

    .cart-item img,
    .cart-item .no-img {
      grid-area: img;
      width: 60px;
      height: 60px;
    }

    .item-info {
      grid-area: name;
    }

    .qty-controls {
      grid-area: qty;
      justify-self: start;
    }

    .line-total {
      grid-area: total;
      justify-self: end;
    }

    .remove-btn {
      grid-area: remove;
      justify-self: end;
    }
  }
</style>
</head>
<body>

  <header>
    <h1>Your Cart</h1>
    <p class="subtitle">Review your order before checkout</p>
  </header>

  <main>
    <div class="cart" id="cart">
      <div id="cart-items"></div>

      <div class="cart-summary">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="subtotal">R0.00</span>
        </div>
        <div class="summary-row">
          <span>Delivery</span>
          <span id="delivery">R0.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="total">R0.00</span>
        </div>

        <button class="checkout-btn" id="checkout-btn" type="button">Proceed to Checkout</button>

        <form class="checkout-form" id="checkout-form">
          <label for="co-name">Your name</label>
          <input type="text" id="co-name" required autocomplete="name">

          <label for="co-phone">Phone number</label>
          <input type="tel" id="co-phone" required autocomplete="tel">

          <label for="co-address">Delivery address</label>
          <textarea id="co-address" rows="2" required autocomplete="street-address"></textarea>

          <label for="co-notes">Notes (optional)</label>
          <textarea id="co-notes" rows="2" placeholder="Allergies, delivery instructions, etc."></textarea>

          <button class="checkout-btn" type="submit" style="width:100%">Place order</button>
        </form>
      </div>
    </div>

    <p class="empty-cart" id="empty-message">Your cart is empty.</p>

    <div class="confirmation" id="confirmation">
      <h2>Order placed!</h2>
      <p id="confirmation-text"></p>
    </div>

    <p class="continue-link"><a href="menu (1).html">&larr; Continue shopping</a></p>
  </main>

  <script>
    var CART_KEY = 'bakeryCart';
    var ORDERS_KEY = 'bakeryOrders';
    var DELIVERY_FEE = 10.00;

    var cartBox = document.getElementById('cart');
    var itemsBox = document.getElementById('cart-items');
    var emptyMessage = document.getElementById('empty-message');
    var confirmation = document.getElementById('confirmation');
    var checkoutBtn = document.getElementById('checkout-btn');
    var checkoutForm = document.getElementById('checkout-form');

    // The cart is shared with the menu page: { name: { name, price, qty, img } }
    var cart = loadJSON(CART_KEY, {});

    function loadJSON(key, fallback) {
      try {
        var raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) { return fallback; }
    }

    function saveJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* ignore */ }
    }

    function money(n) {
      return 'R' + n.toFixed(2);
    }

    function make(tag, className, text) {
      var e = document.createElement(tag);
      if (className) e.className = className;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    function calcSubtotal() {
      return Object.keys(cart).reduce(function (t, k) {
        return t + cart[k].price * cart[k].qty;
      }, 0);
    }

    function render() {
      itemsBox.innerHTML = '';
      var names = Object.keys(cart);

      names.forEach(function (name) {
        var it = cart[name];
        var row = make('div', 'cart-item');
        row.dataset.name = name;

        if (it.img) {
          var img = document.createElement('img');
          img.src = it.img;
          img.alt = it.name;
          row.appendChild(img);
        } else {
          row.appendChild(make('div', 'no-img'));
        }

        var info = make('div', 'item-info');
        info.appendChild(make('div', 'item-name', it.name));
        info.appendChild(make('div', 'item-price', money(it.price) + ' each'));
        row.appendChild(info);

        var qty = make('div', 'qty-controls');
        var minus = make('button', 'qty-btn minus', '\u2212');
        minus.type = 'button';
        minus.setAttribute('aria-label', 'Remove one ' + it.name);
        var qtyValue = make('span', 'qty-value', String(it.qty));
        var plus = make('button', 'qty-btn plus', '+');
        plus.type = 'button';
        plus.setAttribute('aria-label', 'Add one ' + it.name);
        qty.appendChild(minus);
        qty.appendChild(qtyValue);
        qty.appendChild(plus);
        row.appendChild(qty);

        row.appendChild(make('div', 'line-total', money(it.price * it.qty)));

        var remove = make('button', 'remove-btn', '\u00D7');
        remove.type = 'button';
        remove.title = 'Remove';
        remove.setAttribute('aria-label', 'Remove ' + it.name);
        row.appendChild(remove);

        itemsBox.appendChild(row);
      });

      var subtotal = calcSubtotal();
      var delivery = subtotal > 0 ? DELIVERY_FEE : 0;
      document.getElementById('subtotal').textContent = money(subtotal);
      document.getElementById('delivery').textContent = money(delivery);
      document.getElementById('total').textContent = money(subtotal + delivery);

      var hasItems = names.length > 0;
      cartBox.style.display = hasItems ? 'block' : 'none';
      emptyMessage.style.display = hasItems ? 'none' : 'block';
    }

    itemsBox.addEventListener('click', function (e) {
      var row = e.target.closest('.cart-item');
      if (!row) return;
      var name = row.dataset.name;
      if (!cart[name]) return;

      if (e.target.classList.contains('plus')) {
        cart[name].qty += 1;
      } else if (e.target.classList.contains('minus')) {
        cart[name].qty -= 1;
        if (cart[name].qty <= 0) delete cart[name];
      } else if (e.target.classList.contains('remove-btn')) {
        delete cart[name];
      } else {
        return;
      }

      saveJSON(CART_KEY, cart);
      render();
    });

    checkoutBtn.addEventListener('click', function () {
      checkoutBtn.style.display = 'none';
      checkoutForm.classList.add('open');
      document.getElementById('co-name').focus();
    });

    checkoutForm.addEventListener('submit', function (e) {
      e.preventDefault();

      var subtotal = calcSubtotal();
      var order = {
        id: 'BK' + Date.now().toString().slice(-6),
        customer: document.getElementById('co-name').value.trim(),
        phone: document.getElementById('co-phone').value.trim(),
        address: document.getElementById('co-address').value.trim(),
        notes: document.getElementById('co-notes').value.trim(),
        items: Object.keys(cart).map(function (k) { return cart[k]; }),
        subtotal: subtotal,
        delivery: DELIVERY_FEE,
        total: subtotal + DELIVERY_FEE,
        placedAt: new Date().toISOString()
      };

      placeOrder(order);

      cart = {};
      saveJSON(CART_KEY, cart);

      cartBox.style.display = 'none';
      emptyMessage.style.display = 'none';
      confirmation.style.display = 'block';
      document.getElementById('confirmation-text').textContent =
        'Thank you, ' + order.customer + '! Your order number is ' + order.id +
        '. Total: ' + money(order.total) + '.';
    });

    // Right now the order is only saved in this browser so you can test the flow.
    // To take real orders and payments, replace the body of this function with a
    // call to your server or payment provider, e.g.:
    //   fetch('/api/orders', { method: 'POST',
    //     headers: { 'Content-Type': 'application/json' },
    //     body: JSON.stringify(order) });
    function placeOrder(order) {
      var orders = loadJSON(ORDERS_KEY, []);
      orders.push(order);
      saveJSON(ORDERS_KEY, orders);
      console.log('Order placed:', order);
    }

    render();
  </script>

</body>
</html>
